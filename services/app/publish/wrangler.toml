name = "pages-publish"
main = "src/worker.js"
compatibility_date = "2026-10-01"

routes = [{ pattern = "publish.flisk.si", custom_domain = true }]

[vars]
PAGES_REPO = "flisk-sh/pages"
PAGES_ORIGIN = "https://pages.flisk.si"
PUBLISH_ORIGIN = "https://publish.flisk.si"
ALLOWED_ORIGINS = "https://roadmap.flisk.si,https://pages.flisk.si,https://tools.flisk.si"
GITHUB_CLIENT_ID = "Ov23liQT0l2ro3Ajvwk5" # the OAuth app's client id (Settings → Developer settings → OAuth Apps)
MAX_PER_IP_HOUR = "5"
MAX_PER_IP_DAY = "20"
MAX_PER_HOUR = "120"
MAX_CI_PER_HOUR = "20"   # per repository owner, for POST /v1/ci/spaces
MAX_CI_PER_DAY = "100"

# Secret (set once): bunx wrangler@4 secret put GITHUB_TOKEN
#   a fine-grained token for flisk-sh/pages only, "Contents: read and write" (repository_dispatch needs it)
# Sign in with GitHub (optional): an OAuth app whose callback is https://publish.flisk.si/auth/callback, no scopes.
#   bunx wrangler@4 secret put GITHUB_CLIENT_SECRET
#   bunx wrangler@4 secret put SESSION_SECRET      (any long random string)
