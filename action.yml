name: "Flisk Pages: check and publish"
description: "Check a page against the Pages rules in CI, and publish it to pages.flisk.si. The check needs no keys."
author: "flisk-sh"
branding:
  icon: "upload-cloud"
  color: "purple"

inputs:
  path:
    description: "The page: a folder with an index.html or index.md, or one .html or .md file, relative to the workspace. Run actions/checkout first."
    required: true
  command:
    description: "check (default) runs the same rules as the publish and sends nothing. publish also puts the page on pages.flisk.si."
    required: false
    default: "check"
  slug:
    description: "The name for publish: the page goes live at /@<your login>/<slug>/. Defaults to the folder name."
    required: false
    default: ""
  wait:
    description: "With publish, wait until the link answers (true or false)."
    required: false
    default: "true"
  token:
    description: "For publish only: a GitHub token (a personal access token that can fork and open pull requests). Not needed for check."
    required: false
    default: ""
  node-version:
    description: "Node.js version (18 or later)."
    required: false
    default: "22"

outputs:
  ok:
    description: "true when the check passed (and, for publish, the page was sent)."
    value: ${{ steps.run.outputs.ok }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - id: run
      shell: bash
      env:
        PG_PATH: ${{ inputs.path }}
        PG_COMMAND: ${{ inputs.command }}
        PG_SLUG: ${{ inputs.slug }}
        PG_WAIT: ${{ inputs.wait }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -u +e
        # The CLI runs from this action's own checkout, so it is the version you pinned and needs no install.
        cli="${GITHUB_ACTION_PATH}/bin/pages.mjs"
        target="${GITHUB_WORKSPACE}/${PG_PATH}"
        case "$PG_COMMAND" in check|publish) ;; *) echo "::error::command is check or publish."; exit 2 ;; esac

        out="${RUNNER_TEMP}/pages-check.txt"
        node "$cli" check "$target" > "$out" 2>&1
        code=$?
        cat "$out"
        {
          if [ "$code" -eq 0 ]; then echo "### Pages check: passed"; else echo "### Pages check: problems to fix"; fi
          echo
          echo '```'
          cat "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$code" -eq 0 ] && [ "$PG_COMMAND" = "publish" ]; then
          args=(publish "$target")
          [ -n "$PG_SLUG" ] && args+=(--slug "$PG_SLUG")
          [ "$PG_WAIT" = "true" ] && args+=(--wait)
          node "$cli" "${args[@]}"
          code=$?
        fi
        echo "ok=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        exit "$code"
