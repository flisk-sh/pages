name: "Flisk Pages: check and publish"
description: "Check a page in CI and publish it to pages.flisk.si/@<owner>/<name>. No keys: publish uses the job's OIDC token."
author: "flisk-sh"
branding:
  icon: "upload-cloud"
  color: "purple"

inputs:
  path:
    description: "The page: a folder with an index.html or index.md, or one .html or .md file, relative to the workspace. Run actions/checkout first."
    required: true
  command:
    description: "check (default) runs the same rules as the publish and sends nothing. publish also puts the page on pages.flisk.si/@<repository owner>/<slug>/ (the job needs permissions: id-token: write). remove takes /@<repository owner>/<slug>/ down (needs slug)."
    required: false
    default: "check"
  slug:
    description: "The name for publish: the page goes live at /@<your login>/<slug>/. Defaults to the folder name."
    required: false
    default: ""
  wait:
    description: "With publish, wait until the link answers (true or false)."
    required: false
    default: "true"
  token:
    description: "Leave empty: publish uses the job's OIDC token and needs no secret. Only to publish under your own login through a pull request instead: a personal access token that can fork and open pull requests."
    required: false
    default: ""
  node-version:
    description: "Node.js version (18 or later)."
    required: false
    default: "22"

outputs:
  ok:
    description: "true when the check passed (and, for publish, the page was sent)."
    value: ${{ steps.run.outputs.ok }}
  url:
    description: "With publish, the page's link."
    value: ${{ steps.run.outputs.url }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - id: run
      shell: bash
      env:
        PG_PATH: ${{ inputs.path }}
        PG_COMMAND: ${{ inputs.command }}
        PG_SLUG: ${{ inputs.slug }}
        PG_WAIT: ${{ inputs.wait }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -u +e
        # The CLI runs from this action's own checkout, so it is the version you pinned and needs no install.
        cli="${GITHUB_ACTION_PATH}/bin/pages.mjs"
        target="${GITHUB_WORKSPACE}/${PG_PATH}"
        case "$PG_COMMAND" in check|publish|remove) ;; *) echo "::error::command is check, publish or remove."; exit 2 ;; esac

        if [ "$PG_COMMAND" = "remove" ]; then
          [ -n "$PG_SLUG" ] || { echo "::error::remove needs the slug of the page to take down."; exit 2; }
          node "$cli" remove "$PG_SLUG" --oidc
          code=$?
          echo "ok=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$code"
        fi

        out="${RUNNER_TEMP}/pages-check.txt"
        node "$cli" check "$target" > "$out" 2>&1
        code=$?
        cat "$out"
        {
          if [ "$code" -eq 0 ]; then echo "### Pages check: passed"; else echo "### Pages check: problems to fix"; fi
          echo
          echo '```'
          cat "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$code" -eq 0 ] && [ "$PG_COMMAND" = "publish" ]; then
          args=(publish "$target")
          [ -n "$PG_SLUG" ] && args+=(--slug "$PG_SLUG")
          [ "$PG_WAIT" = "true" ] && args+=(--wait)
          # No token: the job's own OIDC token says which repository this is, so nobody sets up a secret.
          [ -z "$GH_TOKEN" ] && args+=(--oidc)
          pub="${RUNNER_TEMP}/pages-publish.txt"
          node "$cli" "${args[@]}" 2>&1 | tee "$pub"
          code=${PIPESTATUS[0]}
          url=$(grep -oE 'https://pages\.flisk\.si/@[a-z0-9-]+/[a-z0-9-]+/' "$pub" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && [ -n "$url" ]; then
            { echo; echo "### Published: $url"; } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        echo "ok=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        exit "$code"
