# Typecheck, lint and tests on every push and pull request, then the static site built with no spaces and asked
# for its pages and SEO files. Publish pull requests (spaces/** only) are handled by publish.yml instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ["spaces/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

      - name: Build the site
        run: bun run build
      - name: Look at what it wrote
        run: |
          test -s _site/index.html && grep -q 'application/ld+json' _site/index.html
          grep -q Sitemap _site/robots.txt
          grep -q '<urlset' _site/sitemap.xml
          test -s _site/og.png && test -s _site/404.html
          test "$(cat _site/CNAME)" = pages.flisk.si
