# One-click publishing from publish.flisk.si (services/app/publish): no account, no key for the visitor. The worker
# sends a repository_dispatch; this checks the Markdown like every other publish and commits space/anon/<id>.
# scripts/publish-anon.ts reads the payload from the event file; nothing from it is put into a shell command.
name: Publish (anonymous)
run-name: anon ${{ github.event.client_payload.op }} ${{ github.event.client_payload.id || github.event.client_payload.owner }}

on:
  repository_dispatch:
    types: [pages-anon]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

# One group per space: GitHub keeps one pending run per group and cancels the older one, so a group per owner dropped
# a publish whenever two repositories of the same owner published within a minute.
concurrency:
  group: anon-${{ github.event.client_payload.id || format('{0}/{1}', github.event.client_payload.owner, github.event.client_payload.slug || 'cv') }}
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/publish-anon.ts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The deploy job below rebuilds the site, so the script starts no other run.
          DEPLOY_HERE: "1"

  # The same build and deploy as deploy.yml, here so a one-click space is live without a second run starting.
  deploy:
    name: Build and deploy
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: services/app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the space branches
        run: git fetch --no-tags origin '+refs/heads/space/*:refs/remotes/origin/space/*'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: services/app/web/_site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
